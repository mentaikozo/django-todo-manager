<div class="row">
    <div class="col-3">
        <p>タスク名</p>
    </div>
    <div class="col-9">
        <p>{{ task.name }}</p>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <p>タグ</p>
    </div>
    <div class="col-9">
        <ul>
            {% for tag in object.tags.all %}
                <li>{{ tag.name }}</li>
            {% empty %}
                <li>タグはありません</li>
            {% endfor %}
        </ul>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <p>登録日</p>
    </div>
    <div class="col-9">
        <p>{{ task.pub_date|date:"Y/m/d G:i:s" }}</p>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <p>進捗</p>
    </div>
    <div class="col-9">
        <p>{{ task.progress }}</p>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <p>ステータス</p>
    </div>
    <div class="col-9">
        <p>{{ task.status }}</p>
    </div>
</div>
<div class="row">
    <div class="col-3">
        <p>優先度</p>
    </div>
    <div class="col-9">
        <p>{{ task.priority }}</p>
    </div>
</div>
<hr>
<div class="row">
    <div class="col-3">
        <p>詳細</p>
    </div>
    <div class="col-9">
        <div>{{ description_html|safe }}</div>
    </div>
</div>
